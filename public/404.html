<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Soukna - Redirection...</title>
    <script>
      /**
       * GitHub Pages SPA redirect script
       * Redirige toutes les routes 404 vers index.html avec le pathname encodé
       * Compatible avec BrowserRouter de React Router
       */
      var segmentCount = 1; // 1 pour un repo GitHub Pages avec chemin de base (/Sou9na/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirection en cours...</p>
  </body>
</html>
